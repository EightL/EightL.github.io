<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Koblih Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0d0a16;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            /* Prevent pull-to-refresh and overscroll on mobile */
            overscroll-behavior: none;
            touch-action: none;
        }

        img {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -webkit-user-drag: none;
        }

        #game {
            position: fixed;
            width: 480px;
            height: 720px;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: none;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* ===== INTRO ===== */
        #screen-intro {
            background: radial-gradient(ellipse at 50% 40%, #1e1840 0%, #0a0814 100%);
            align-items: center;
            justify-content: center;
            gap: 0;
            cursor: pointer;
        }

        .screen.hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        #intro-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #intro-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 0 20px;
        }

        #intro-title {
            font-size: 30px;
            color: #f5c842;
            text-shadow: 4px 4px 0 #7a5008, 8px 8px 0 rgba(0, 0, 0, 0.4);
            text-align: center;
            line-height: 1.5;
            letter-spacing: 3px;
            animation: titleFloat 3s ease-in-out infinite;
        }

        #intro-subtitle {
            font-size: 7px;
            color: #a0b8c8;
            letter-spacing: 1px;
            margin-top: -8px;
        }

        #intro-main-parrot {
            width: 140px;
            animation: titleFloat 2.5s ease-in-out infinite;
            filter: drop-shadow(0 8px 20px rgba(245, 200, 66, 0.25));
        }

        #intro-press {
            font-size: 8px;
            color: #80c880;
            animation: blink 1.1s steps(1) infinite;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .intro-parrot-deco {
            position: absolute;
            image-rendering: pixelated;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes titleFloat {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* ===== MAIN SCREEN ===== */
        #hud-top {
            height: 65px;
            background: #1a0e06;
            border-bottom: 3px solid #3d2010;
            padding: 6px 12px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .stat-row-inner {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .stat-bar-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-icon {
            font-size: 8px;
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon img {
            width: 14px;
            height: 14px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .stat-bar-bg {
            flex: 1;
            height: 9px;
            background: #291608;
            border: 2px solid #5a3214;
        }

        .stat-bar-fill {
            height: 100%;
            transition: width 0.5s ease;
        }

        #fill-hunger {
            background: #e0781a;
        }

        #fill-happy {
            background: #e03878;
        }

        #fill-clean {
            background: #3898e0;
        }

        #fill-health {
            background: #38c050;
        }

        .stat-bar-fill.low {
            animation: statPulse 0.8s steps(1) infinite;
        }

        @keyframes statPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        #hud-top-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            height: 100%;
            flex-shrink: 0;
            padding-bottom: 2px;
        }

        #coin-display {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            line-height: 1.2;
            color: #f5c842;
            min-width: 60px;
            justify-content: flex-end;
            margin-top: 2px;
        }

        #settings-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            opacity: 0.7;
            padding: 0;
            transition: opacity 0.15s, transform 0.3s;
        }

        #settings-btn:hover {
            opacity: 1;
            transform: rotate(60deg);
        }

        #save-btn {
            background: #173a2a;
            border: 2px solid #2d7a54;
            color: #8cf0b8;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            line-height: 1;
            padding: 5px 7px;
            transition: background 0.15s, transform 0.15s;
        }

        #save-btn:hover {
            background: #1f4a35;
            transform: translateY(-1px);
        }

        /* Bond bar in HUD */
        #bond-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-right: 2px;
        }

        #bond-heart {
            font-size: 11px;
            line-height: 1;
            transform: translateY(1px);
        }

        #bond-fill-bg {
            width: 44px;
            height: 6px;
            background: #2a0e14;
            border: 1px solid #6a1828;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        #bond-fill {
            height: 100%;
            background: linear-gradient(90deg, #e04080, #f08cc0);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 3px;
        }

        #bond-pct {
            font-size: 8px;
            line-height: 1;
            color: #f08cc0;
            min-width: 18px;
            text-align: right;
            text-shadow: 1px 1px 0 #2a0e14;
        }

        /* Settings modal */
        #settings-modal {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #settings-modal.open {
            display: flex;
        }

        #settings-box {
            background: #1e1208;
            border: 3px solid #5a3418;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-width: 310px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        #settings-title {
            font-size: 12px;
            color: #f5c842;
            text-shadow: 2px 2px 0 #7a5008;
        }

        .settings-btn {
            width: 100%;
            padding: 12px 10px;
            background: #2a1508;
            border: 2px solid #5a3418;
            color: #e0a060;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            cursor: pointer;
            transition: background 0.12s, box-shadow 0.12s;
            text-align: center;
        }

        .settings-btn:hover {
            background: #3a2010;
            box-shadow: 0 0 8px rgba(245, 200, 66, 0.25);
        }

        .settings-btn:active {
            transform: translateY(1px);
        }

        .settings-btn.danger {
            border-color: #883020;
            color: #e06050;
        }

        .settings-btn.danger:hover {
            background: #2a1010;
            box-shadow: 0 0 8px rgba(220, 80, 60, 0.3);
        }

        #settings-close-btn {
            border-color: #4a6030;
            color: #80b050;
        }

        #settings-close-btn:hover {
            background: #182010;
            box-shadow: 0 0 8px rgba(120, 200, 80, 0.25);
        }

        /* Confirm dialog */
        #confirm-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        #confirm-box.open {
            display: flex;
        }

        #confirm-msg {
            font-size: 7px;
            color: #e0c0a0;
            text-align: center;
            line-height: 1.8;
        }

        .confirm-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .confirm-row .settings-btn {
            flex: 1;
        }

        /* ROOM */
        #room {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #2a1a0a;
            touch-action: none;
        }

        #room-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            image-rendering: auto;
            pointer-events: none;
        }

        /* Perch image */
        #perch-img {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: auto;
            pointer-events: none;
            z-index: 1;
        }

        /* Parrot zone */
        #parrot-zone {
            position: absolute;
            bottom: 140px;
            isolation: isolate;
            left: 50%;
            transform: translateX(-50%);
            width: 174px;
            height: 198px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 5;
        }

        #parrot-zone.drag-hover::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 200, 66, 0.32) 0%, rgba(245, 200, 66, 0.08) 55%, transparent 75%);
            pointer-events: none;
            animation: parrotGlow 0.6s ease-in-out infinite alternate;
        }

        @keyframes parrotGlow {
            from {
                opacity: 0.5;
                transform: scale(0.94);
            }

            to {
                opacity: 1;
                transform: scale(1.06);
            }
        }

        #parrot-img {
            width: 240px;
            height: auto;
            image-rendering: pixelated;
            display: block;
            position: relative;
            z-index: 400;
            filter: drop-shadow(2px 6px 8px rgba(0, 0, 0, 0.25));
        }

        #parrot-img.bounce {
            animation: parrotBounce 0.4s ease-out;
        }

        #parrot-img.laying {
            width: 204px;
            transform: translateY(30px);
        }

        @keyframes parrotBounce {
            0% {
                transform: translateY(0) scale(1);
            }

            28% {
                transform: translateY(-16px) scale(0.93);
            }

            60% {
                transform: translateY(-4px) scale(1.04);
            }

            100% {
                transform: translateY(0) scale(1);
            }
        }

        /* Thought Bubble (Emotes/Cravings) */
        #thought-bubble {
            position: absolute;
            top: -20%;
            left: -15%;
            width: 65px;
            height: 54px;
            background: #fff;
            border: 3px solid #000;
            border-radius: 50% / 40%;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            pointer-events: none;
            animation: bubbleFloat 2s ease-in-out infinite;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.3));
        }

        #thought-bubble::before {
            content: '';
            position: absolute;
            bottom: -13px;
            right: 12px;
            width: 15px;
            height: 15px;
            background: #fff;
            border: 3px solid #000;
            border-radius: 50%;
        }

        #thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -24px;
            right: 3px;
            width: 9px;
            height: 9px;
            background: #fff;
            border: 3px solid #000;
            border-radius: 50%;
        }

        #thought-img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            image-rendering: pixelated;
            z-index: 2;
        }

        #thought-text {
            font-size: 24px;
            z-index: 2;
            display: none;
            user-select: none;
        }

        @keyframes bubbleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        #hand-overlay {
            position: absolute;
            width: 85px;
            height: auto;
            image-rendering: pixelated;
            display: none;
            pointer-events: none;
            z-index: 1000;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.3));
        }

        /* Progress ring */
        #progress-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
            z-index: 4;
        }

        /* Floating texts */
        .float-text {
            position: absolute;
            font-size: 7px;
            font-family: 'Press Start 2P', monospace;
            pointer-events: none;
            animation: floatUp 1.3s ease-out forwards;
            z-index: 60;
            white-space: nowrap;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            60% {
                opacity: 1;
                transform: translateY(-44px) scale(1.05);
            }

            100% {
                opacity: 0;
                transform: translateY(-65px) scale(0.8);
            }
        }

        .particle {
            position: absolute;
            font-size: 14px;
            pointer-events: none;
            animation: particlePop 0.9s ease-out forwards;
            z-index: 50;
        }

        @keyframes particlePop {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.4);
            }

            100% {
                opacity: 0;
                transform: translate(var(--px), var(--py)) scale(1.3);
            }
        }

        /* ===== HUD BOTTOM ===== */
        #hud-bottom {
            height: 180px;
            background: #150c04;
            border-top: 3px solid #3d2010;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        #tray-container {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .tray-btn {
            background: #261508;
            border: 2px solid #5a3418;
            color: #f5c842;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            width: 28px;
            height: 58px;
            cursor: pointer;
            margin: 8px 4px 4px;
            flex-shrink: 0;
            display: none;
            /* JS will toggle */
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, background 0.1s;
        }

        .tray-btn:hover {
            background: #361e0a;
            box-shadow: 0 0 8px rgba(245, 200, 66, 0.3);
        }

        .tray-btn:active {
            transform: translateY(1px);
        }

        #item-tray {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px 4px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            /* Hide native scrollbar */
            -ms-overflow-style: none;
            /* IE and Edge */
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: none;
        }

        #item-tray::-webkit-scrollbar {
            display: none;
        }

        .item-card {
            flex-shrink: 0;
            width: 58px;
            height: 58px;
            background: #261508;
            border: 2px solid #4a2c10;
            border-radius: 3px;
            position: relative;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: border-color 0.12s, box-shadow 0.12s, transform 0.1s;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .item-card:hover:not(.depleted) {
            border-color: #f5c842;
            box-shadow: 0 0 10px rgba(245, 200, 66, 0.45);
            transform: translateY(-2px);
        }

        .item-card:active:not(.depleted) {
            transform: translateY(0) scale(0.95);
        }

        .item-card.depleted {
            opacity: 0.38;
            cursor: not-allowed;
            filter: grayscale(0.75);
        }

        .item-card img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            pointer-events: none;
        }

        .item-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 7px;
            color: #f5c842;
        }

        .item-card.infinite .item-count {
            color: #70d070;
        }

        #nav-buttons {
            display: flex;
            gap: 8px;
            padding: 10px 10px 15px;
            /* Increased bottom padding */
            flex: 1;
        }

        .nav-btn {
            flex: 1;
            padding: 16px 6px;
            /* increased vertical padding to make them taller */
            background: #261508;
            border: 2px solid #5a3418;
            color: #f5c842;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            cursor: pointer;
            transition: background 0.12s, box-shadow 0.12s;
            letter-spacing: 0.5px;
        }

        .nav-btn:hover {
            background: #361e0a;
            box-shadow: 0 0 8px rgba(245, 200, 66, 0.3);
        }

        .nav-btn:active {
            transform: translateY(1px);
        }

        .nav-btn.play-btn {
            border-color: #38a058;
            color: #50d070;
        }

        .nav-btn.play-btn:hover {
            background: #152818;
            box-shadow: 0 0 8px rgba(80, 208, 112, 0.35);
        }

        .nav-btn.jump-btn {
            border-color: #a038a0;
            color: #d050d0;
        }

        .nav-btn.jump-btn:hover {
            background: #281528;
            box-shadow: 0 0 8px rgba(208, 80, 208, 0.35);
        }

        .nav-btn-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
            vertical-align: middle;
            image-rendering: pixelated;
            margin-right: 3px;
        }

        /* Global drag ghost */
        #drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            display: none;
            transform: translate(-50%, -50%) scale(1.18) rotate(-10deg);
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.55));
        }

        #drag-ghost img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        /* ===== SHOP ===== */
        #screen-shop {
            background: #110816;
        }

        #shop-header {
            background: #1e0a14;
            padding: 14px 16px 11px;
            border-bottom: 3px solid #601838;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        #shop-title {
            font-size: 15px;
            color: #f5c842;
            text-shadow: 2px 2px 0 #7a5008;
        }

        #shop-coin-display {
            font-size: 9px;
            color: #f5c842;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #shop-back-btn {
            background: #261508;
            border: 2px solid #5a3418;
            color: #f5a040;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 6px 10px;
            cursor: pointer;
        }

        #shop-back-btn:hover {
            background: #361e0a;
        }

        #shop-tabs {
            display: flex;
            background: #1e0a14;
            border-bottom: 2px solid #3a1828;
            flex-shrink: 0;
        }

        .shop-tab {
            flex: 1;
            padding: 12px 10px 10px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #a08060;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            cursor: pointer;
            transition: border-bottom-color 0.15s, color 0.15s, background 0.15s;
        }

        .shop-tab.active {
            color: #f5c842;
            border-bottom-color: #f5c842;
            background: #2a101c;
        }

        .shop-tab:hover:not(.active) {
            background: #240d18;
            color: #e0b898;
        }

        #shop-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 14px;
            overflow-y: auto;
            align-content: start;
        }

        .shop-item {
            background: #220a16;
            border: 2px solid #5a1830;
            border-radius: 4px;
            padding: 14px 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            transition: border-color 0.12s, box-shadow 0.12s, transform 0.1s;
        }

        .shop-item:hover:not(.cant-afford) {
            border-color: #f5c842;
            box-shadow: 0 0 12px rgba(245, 200, 66, 0.4);
            transform: translateY(-2px);
        }

        .shop-item:active:not(.cant-afford) {
            transform: translateY(0);
        }

        .shop-item.cant-afford {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .shop-item img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .shop-item-name {
            font-size: 6px;
            color: #e0b898;
            text-align: center;
        }

        .shop-item-price {
            font-size: 8px;
            color: #f5c842;
        }

        .shop-item-owned {
            font-size: 6px;
            color: #707070;
        }

        /* Shop section divider */
        .shop-section-header {
            grid-column: 1 / -1;
            font-size: 7px;
            color: #a08060;
            border-bottom: 2px solid #3a1828;
            padding-bottom: 6px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* Room cards in shop — wider thumbnail */
        .shop-room-item {

        }

            border: 2px solid #7a4020;

            font-size: 7px;
            padding: 5px 8px;
            cursor: pointer;
        }

        .btn-leaderboard-header:hover {
            background: #3a2010;
        }

        #jump-canvas {
            display: block;
            flex: 1;
            image-rendering: pixelated;
            touch-action: none;
        }

        /* ===== MOBILE SCALING ===== */
        /* Scale #game to fill the viewport on small screens
           keeping the 480:720 (2:3) aspect ratio intact.
           All game-internal coordinates stay the same — only CSS scale changes. */
        @media (max-width: 520px),
        (max-height: 740px) {

            html,
            body {
                width: 100%;
                height: 100%;
                /* belt + suspenders: kill every touch behaviour that could scroll the page */
                touch-action: none;
                overscroll-behavior: none;
            }

            #game {
                /* Use dynamic viewport units so the game fills the visible area
                   even when the browser chrome (address bar / nav bar) appears/disappears */
                --game-scale: min(calc(100dvw / 480), calc(100dvh / 720));
                width: 480px;
                height: 720px;
                transform-origin: top left;
                transform: scale(var(--game-scale));
                /* Re-centre after scaling  */
                left: calc((100dvw - 480px * var(--game-scale)) / 2);
                top: calc((100dvh - 720px * var(--game-scale)) / 2);
            }

            /* Make HUD elements comfortably large on touch screens */
            #hud-top {
                height: 60px;
                padding: 8px 14px 7px;
            }

                height: 13px;
                border-width: 2px;
            }

                width: 18px;
                height: 18px;
                font-size: 11px;
            }

            .stat-icon img {
                width: 18px;
                height: 18px;
            }

            #coin-display {
                font-size: 12px;
            }

            #save-btn {
                font-size: 8px;
                padding: 7px 8px;
            }

            #hud-bottom {
                height: 200px;
            }

            .item-card {
                width: 66px;
                height: 66px;
            }

            .item-card img {
                width: 46px;
                height: 46px;
            }

            .item-count {
                font-size: 8px;
            }

            .nav-btn {
                padding: 14px 6px;
                font-size: 9px;
            }

            #nav-buttons {
                padding: 6px 10px 12px;
                gap: 10px;
            }

            #item-tray {
                padding: 10px 10px 5px;
                gap: 8px;
            }

            /* Settings modal */
            #settings-box {
                min-width: 340px;
                padding: 36px 30px;
            }

            .settings-btn {
                padding: 14px 12px;
                font-size: 9px;
            }

            #settings-title {
                font-size: 14px;
            }

            /* Shop back button */
            #shop-back-btn {
                font-size: 9px;
                padding: 9px 14px;
            }

            /* Minigame back buttons */
            #flappy-back-btn,
            #jump-back-btn,
            .btn-leaderboard-header {
                font-size: 9px;
                padding: 8px 12px;
            }
        }

        /* Auth & Leaderboard CSS */
        .auth-status {
            font-size: 8px;
            color: #d06050;
            text-align: center;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .auth-status.logged-in {
            color: #50d070;
        }

        #auth-form {
            display: none;
            flex-direction: column;

        }

        #auth-form input {

            padding: 8px;
            font-family: inherit;
            font-size: 10px;
        }

        #auth-form input:focus {

            border-color: #f5c842;
        }

        .auth-btn-row {
            display: flex;
            gap: 8px;
        }

        #leaderboard-modal {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 300;
            display: none;
            align-items: center;

        }

        #leaderboard-modal.open {

        }

        #leaderboard-box {

        }

        .lb-tab {

        }

        .lb-score {
            width: 50px;
            text-align: right;
            color: #f5c842;
        }
    </style>
</head>

                const el = screenElements[id];
                if (el) {
                    el.classList.remove('hidden'); // Ensure it's not hidden by intro logic
                    el.classList.add('active');
                }
                registry[id]?.onEnter?.();
            }

            return { register, go, current: () => current };
        })();

        // ════════════════════════════════════════════════
        // PARROT ANIMATOR
        // ════════════════════════════════════════════════

        const Parrot = (() => {
            let imgEl, handEl, ringEl, arcEl, bubbleEl, thoughtImgEl, thoughtTextEl;
            let idleTimer = null;
            let thoughtTimer = null;
            let locked = false;
            let currentThought = null;
            const CRAVING_POOL = ['food', 'snack', 'vitamins', 'playing_toy', 'bath'];

            function init() {
                imgEl = document.getElementById('parrot-img');
                handEl = document.getElementById('hand-overlay');
                ringEl = document.getElementById('progress-ring');
                arcEl = document.getElementById('progress-arc');
                bubbleEl = document.getElementById('thought-bubble');
                thoughtImgEl = document.getElementById('thought-img');
                thoughtTextEl = document.getElementById('thought-text');
            }

            function setImg(key) {
                const src = PARROT_IMG[key];
                if (src) imgEl.src = src;
                imgEl.classList.toggle('laying', key === 'laying');
            }

            function bounce() {
                imgEl.classList.remove('bounce');
                void imgEl.offsetWidth;
                imgEl.classList.add('bounce');
                setTimeout(() => imgEl.classList.remove('bounce'), 450);
            }

            function lock(key, dur) {
                locked = true;
                clearIdle();
                setImg(key);
                if (dur) setTimeout(unlock, dur);
            }

            function unlock() {
                locked = false;
                startIdle();
            }

            function clearIdle() {
                if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
            }

            function startIdle() {
                clearIdle();
                if (locked) return;

                const s = State.get().stats;
                const avg = (s.hunger + s.happy + s.clean + s.health) / 4;

                let pool;
                if (avg >= 65) pool = IDLE_POOL_HAPPY;
                else if (avg >= 35) pool = IDLE_POOL_NEUTRAL;
                else pool = IDLE_POOL_SAD;

                // Show fat parrot if overfed
                if (s.hunger > 92 && Math.random() < 0.4) pool = ['idle_fat'];

                const pick = pool[Math.floor(Math.random() * pool.length)];
                setImg(pick);

                // Always clear the previous thought so they properly cycle
                if (currentThought) {
                    clearThought();
                }

                // Chance to spawn a thought/craving/emote
                // Feelings (text emotes) are weighted much more heavily (~65% of all thoughts)
                if (Math.random() < 0.35) {
                    const stats = State.get().stats;
                    let type = null;
                    let val = null;

                    // Roll: 65% chance for feeling, 35% chance for item craving
                    const feelingRoll = Math.random();
                    if (feelingRoll < 0.65) {
                        // Feeling bubble — pick based on stats
                        if (stats.happy > 85 && Math.random() < 0.6) {
                            type = 'text'; val = '❤️';
                        } else if (stats.happy > 70 && Math.random() < 0.4) {
                            type = 'text'; val = '😊';
                        } else if (stats.happy < 30) {
                            type = 'text'; val = '🌩️';
                        } else if (stats.clean < 30) {
                            type = 'text'; val = '💩';
                        } else if (stats.health < 40) {
                            type = 'text'; val = '🤒';
                        } else if (stats.hunger < 40) {
                            type = 'text'; val = '🍩';
                        } else if (stats.hunger > 92) {
                            type = 'text'; val = '😴';
                        } else {
                            // Neutral happy thought
                            const happyThoughts = ['❤️', '😊', '🎶', '✨'];
                            type = 'text'; val = happyThoughts[Math.floor(Math.random() * happyThoughts.length)];
                        }
                    } else {
                        // Item craving based on lowest stat
                        let minStat = 'hunger';
                        let minVal = stats.hunger;
                        if (stats.health < minVal) { minVal = stats.health; minStat = 'health'; }
                        if (stats.happy < minVal) { minVal = stats.happy; minStat = 'happy'; }
                        if (stats.clean < minVal) { minVal = stats.clean; minStat = 'clean'; }

                        if (minVal < 70) {
                            const map = {
                                hunger: ['food', 'snack'],
                                health: ['vitamins', 'medical_kit'],
                                happy: ['playing_toy'],
                                clean: ['bath', 'clean_tools']
                            };
                            const pool = map[minStat];
                            type = 'item';
                            val = pool[Math.floor(Math.random() * pool.length)];
                        } else {
                            // Stats are fine — show a positive feeling
                            type = 'text'; val = '❤️';
                        }
                    }

                    if (type) showThought(type, val);
                }

                idleTimer = setTimeout(startIdle, 2200 + Math.random() * 2800);
            }

            function showThought(type, value) {
                if (thoughtTimer) { clearTimeout(thoughtTimer); thoughtTimer = null; }
                currentThought = { type, value };
                if (type === 'item') {
                    thoughtImgEl.src = ITEMS[value].img;
                    thoughtImgEl.style.display = 'block';
                    thoughtTextEl.style.display = 'none';
                } else {
                    thoughtTextEl.textContent = value;
                    thoughtTextEl.style.display = 'block';
                    thoughtImgEl.style.display = 'none';
                }
                bubbleEl.style.display = 'flex';
                // Auto-clear item cravings after 5s, text emotes after 3s
                const dur = type === 'item' ? 5000 : 3000;
                thoughtTimer = setTimeout(() => clearThought(), dur);
            }

            function showHand(src, lx, ly) {
                handEl.src = src;
                handEl.style.display = 'block';
                handEl.style.left = (lx - 40) + 'px';
                handEl.style.top = (ly - 25) + 'px';
            }

            function hideHand() { handEl.style.display = 'none'; }

            function showProgress(v) {
                ringEl.style.display = 'block';
                arcEl.setAttribute('stroke-dashoffset', 659.7 * (1 - Math.min(1, v)));
            }

            function hideProgress() {
                ringEl.style.display = 'none';
                arcEl.setAttribute('stroke-dashoffset', 659.7);
            }

            function getZone(relY) {
                if (relY < 0.30) return 'top';      // top 30% → hand_pet
                if (relY < 0.70) return 'mid';      // 30-50%  → hand_scratch_down
                return 'body';                       // rest     → hand_scratch_up
            }

            function getThought() { return currentThought; }
            function clearThought() {
                if (thoughtTimer) { clearTimeout(thoughtTimer); thoughtTimer = null; }
                currentThought = null;
                bubbleEl.style.display = 'none';
            }

            return { init, setImg, bounce, lock, unlock, clearIdle, startIdle, showHand, hideHand, showProgress, hideProgress, getZone, getThought, clearThought, showThought };
        })();

        // ════════════════════════════════════════════════
        // HUD
        // ════════════════════════════════════════════════

        const HUD = (() => {
            function updateStats() {
                const s = State.get().stats;
                for (const [k, v] of Object.entries(s)) {
                    const el = document.getElementById('fill-' + k);
                    if (el) { el.style.width = v + '%'; el.classList.toggle('low', v < 30); }
                }
                updateCoins();
            }
            function updateCoins() {
                const c = State.get().coins;
                const a = document.getElementById('coin-count');
                const b = document.getElementById('shop-coin-count');
                if (a) a.textContent = c;
                if (b) b.textContent = c;
            }
            function updateBond() {
                const bond = State.getBond();
                const fill = document.getElementById('bond-fill');
                const pct = document.getElementById('bond-pct');
                if (fill) fill.style.width = bond + '%';
                if (pct) pct.textContent = bond;
            }
            function updateAll() { updateStats(); updateBond(); }
            return { updateStats, updateCoins, updateBond, updateAll };
        })();


        // ════════════════════════════════════════════════
        // FX (particles & floats)
        // ════════════════════════════════════════════════

        const FX = (() => {
            const roomEl = () => document.getElementById('room');

            function floatText(text, color, x, y) {
                const el = document.createElement('div');
                el.className = 'float-text';
                el.textContent = text;
                el.style.cssText = `left:${x}px;top:${y}px;color:${color};`;
                roomEl().appendChild(el);
                setTimeout(() => el.remove(), 1400);
            }

            function burst(emoji, x, y, n = 5) {
                for (let i = 0; i < n; i++) {
                    const el = document.createElement('div');
                    el.className = 'particle';
                    const a = Math.random() * Math.PI * 2;
                    const r = 30 + Math.random() * 55;
                    el.textContent = emoji;
                    el.style.cssText = `left:${x}px;top:${y}px;--px:${Math.cos(a) * r}px;--py:${Math.sin(a) * r - 15}px;animation-delay:${Math.random() * 0.15}s;`;
                    roomEl().appendChild(el);
                    setTimeout(() => el.remove(), 1100);
                }
            }

            return { floatText, burst };
        })();

        // ════════════════════════════════════════════════
        // TRAY
        // ════════════════════════════════════════════════

        const Tray = (() => {
            function render() {
                const tray = document.getElementById('item-tray');
                tray.innerHTML = '';
                const inv = State.get().inventory;

                for (const key of TRAY_ORDER) {
                    const item = ITEMS[key];
                    const count = inv[key] || 0;
                    const depleted = !item.infinite && count <= 0;

                    const card = document.createElement('div');
                    card.className = 'item-card' + (depleted ? ' depleted' : '') + (item.infinite ? ' infinite' : '');
                    card.dataset.item = key;

                    const img = document.createElement('img');
                    img.src = item.img; img.alt = item.label;
                    card.appendChild(img);

                    const badge = document.createElement('div');
                    badge.className = 'item-count';
                    badge.textContent = item.infinite ? '\u221e' : count;
                    card.appendChild(badge);

                    if (!depleted) {
                        card.addEventListener('pointerdown', e => {
                            e.preventDefault();
                            Drag.start(e, key);
                        });
                        card.addEventListener('touchstart', e => {
                            // Prevent default only if it's a vertical scroll attempt
                            // This allows horizontal scrolling of the tray
                            const startY = e.touches[0].clientY;
                            const startX = e.touches[0].clientX;
                            const handleTouchMove = (moveEvent) => {
                                const deltaY = Math.abs(moveEvent.touches[0].clientY - startY);
                                const deltaX = Math.abs(moveEvent.touches[0].clientX - startX);
                                if (deltaY > deltaX && deltaY > 5) { // If vertical movement is dominant
                                    moveEvent.preventDefault();
                                }
                            };
                            card.addEventListener('touchmove', handleTouchMove, { passive: false });
                            card.addEventListener('touchend', () => {
                                card.removeEventListener('touchmove', handleTouchMove);
                            });
                        }, { passive: false });
                    }

                    tray.appendChild(card);
                }

                // Allow DOM to update before checking scroll width
                requestAnimationFrame(updateTrayButtons);
            }

            // Scroll button logic
            const trayBtnLeft = document.getElementById('tray-btn-left');
            const trayBtnRight = document.getElementById('tray-btn-right');
            const itemTray = document.getElementById('item-tray');

            function updateTrayButtons() {
                const needsScroll = itemTray.scrollWidth > itemTray.clientWidth + 2; // +2 for fractional pixels
                trayBtnLeft.style.display = needsScroll ? 'flex' : 'none';
                trayBtnRight.style.display = needsScroll ? 'flex' : 'none';

                if (needsScroll) {
                    trayBtnLeft.style.opacity = itemTray.scrollLeft > 5 ? '1' : '0.3';
                    trayBtnRight.style.opacity = (itemTray.scrollLeft + itemTray.clientWidth < itemTray.scrollWidth - 5) ? '1' : '0.3';
                }
            }

            trayBtnLeft.addEventListener('click', () => {
                const currentScroll = Math.floor(itemTray.scrollLeft);
                if (currentScroll <= 0) return;
                Audio.sfx.click();
                itemTray.scrollBy({ left: -140, behavior: 'smooth' });
            });
            trayBtnRight.addEventListener('click', () => {
                const maxScrollLeft = Math.floor(itemTray.scrollWidth - itemTray.clientWidth);
                const currentScroll = Math.floor(itemTray.scrollLeft);
                if (currentScroll >= maxScrollLeft - 1) return;
                Audio.sfx.click();
                itemTray.scrollBy({ left: 140, behavior: 'smooth' });
            });

            itemTray.addEventListener('scroll', updateTrayButtons);
            window.addEventListener('resize', () => requestAnimationFrame(updateTrayButtons));

            return { render };
        })();

        // ════════════════════════════════════════════════
        // DRAG SYSTEM
        // ════════════════════════════════════════════════

        const Drag = (() => {
            let activeKey = null;
            let ghostEl, ghostImg, zoneEl;
            let scrub = null; // { moveDist, lastX, lastY, progress }
            let petZone = null;

            // Direct interaction (petting without item)
            let directPetDist = 0;
            let lastDirectPetX = 0;
            let lastDirectPetY = 0;
            let directPetCooldownTimer = null;
            let canDirectPet = true;
            let isDirectHover = false;

            // Pending drag — wait for movement threshold before committing
            let pending = null; // { key, startX, startY }
            const DRAG_THRESH = 9;
            const DIRECT_PET_THRESH = 250; // pixels of movement required to trigger pet

            function init() {
                ghostEl = document.getElementById('drag-ghost');
                ghostImg = document.getElementById('drag-ghost-img');
                zoneEl = document.getElementById('parrot-zone');

                window.addEventListener('pointermove', onMove, { passive: false });
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', cancel);
            }

            function start(e, key) {
                if (activeKey || pending) return;
                // Don't preventDefault yet — let the tray scroll horizontally if the
                // user swipes sideways. We commit to a drag only after the pointer
                // moves past the threshold in a non-horizontal direction.
                pending = { key, startX: e.clientX, startY: e.clientY };
            }

            function activateDrag(key, cx, cy) {
                activeKey = key;
                pending = null;
                Audio.sfx.click();
                ghostImg.src = ITEMS[key].img;
                ghostEl.style.display = 'block';
                positionGhost(cx, cy);
            }

            function positionGhost(cx, cy) {
                // Ghost is outside #game, so position:fixed is true viewport coords
                ghostEl.style.left = cx + 'px';
                ghostEl.style.top = cy + 'px';
            }

            function gameScale() {
                const r = document.getElementById('game').getBoundingClientRect();
                return r.width / 480;
            }

            function overParrot(cx, cy) {
                const r = zoneEl.getBoundingClientRect();
                return cx >= r.left && cx <= r.right && cy >= r.top && cy >= r.top + r.height * 0.1 && cy <= r.bottom; // Adjusted to ignore top 10% for better interaction
            }

            function relY(cy) {
                const r = zoneEl.getBoundingClientRect();
                return (cy - r.top) / r.height;
            }

            function localCoords(cx, cy) {
                // Convert viewport coords → game-local coords (hand overlay lives inside scaled #game)
                const r = zoneEl.getBoundingClientRect();
                const scale = gameScale();
                return { lx: (cx - r.left) / scale, ly: (cy - r.top) / scale };
            }

            function onMove(e) {
                // Resolve pending drag intent
                if (pending) {
                    const dx = e.clientX - pending.startX;
                    const dy = e.clientY - pending.startY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // If we see significant vertical movement, proactively block browser gestures
                    if (Math.abs(dy) > 4 && Math.abs(dy) > Math.abs(dx)) {
                        if (e.cancelable) e.preventDefault();
                    }

                    if (dist > DRAG_THRESH) {
                        // Pure horizontal swipe → let tray scroll, drop pending
                        if (Math.abs(dx) > Math.abs(dy) * 1.6) {
                            pending = null;
                            return;
                        }
                        // Otherwise commit to drag
                        if (e.cancelable) e.preventDefault();
                        activateDrag(pending.key, e.clientX, e.clientY);
                    }
                    return;
                }

                const over = overParrot(e.clientX, e.clientY);

                if (!activeKey) {
                    // Direct Petting Logic (no item dragged)
                    if (over) {
                        const { lx, ly } = localCoords(e.clientX, e.clientY);
                        const ry = relY(e.clientY);
                        const zone = Parrot.getZone(ry);

                        // Visuals for hovering
                        isDirectHover = true;
                        if (zone === 'top') {
                            Parrot.lock('pet_head', 0);
                            Parrot.showHand('images/hand_pet.png', lx, ly);
                        } else if (zone === 'mid') {
                            Parrot.lock('pet_front', 0);
                            Parrot.showHand('images/hand_scratch_down.png', lx, ly);
                        } else {
                            Parrot.lock('laying', 0);
                            Parrot.showHand('images/hand_scratch_up.png', lx, ly);
                        }

                        if (canDirectPet) {
                            const dx = e.clientX - lastDirectPetX;
                            const dy = e.clientY - lastDirectPetY;
                            directPetDist += Math.sqrt(dx * dx + dy * dy);
                            lastDirectPetX = e.clientX;
                            lastDirectPetY = e.clientY;

                            if (directPetDist > DIRECT_PET_THRESH) {
                                triggerDirectPet(e);
                            }
                        }
                    } else {
                        if (isDirectHover) {
                            isDirectHover = false;
                            Parrot.hideHand();
                            Parrot.unlock();
                        }
                    }
                    return;
                }

                e.preventDefault();
                positionGhost(e.clientX, e.clientY);
                zoneEl.classList.toggle('drag-hover', over);
                const itype = ITEMS[activeKey].interaction;

                if (over) {
                    if (itype === 'pet') doPetMove(e);
                    if (itype === 'scrub') doScrubMove(e);
                } else {
                    if (scrub || petZone) resetInteraction();
                }
            }

            function cancel() {
                pending = null;
                if (!activeKey) return;
                ghostEl.style.display = 'none';
                zoneEl.classList.remove('drag-hover');
                Parrot.hideHand(); Parrot.hideProgress();
                activeKey = null; scrub = null; petZone = null;
                Parrot.unlock();
            }

            function doPetMove(e) {
                const ry = relY(e.clientY);
                const zone = Parrot.getZone(ry);
                const { lx, ly } = localCoords(e.clientX, e.clientY);

                if (zone !== petZone) {
                    petZone = zone;
                    Audio.sfx.pet();
                    if (navigator.vibrate) navigator.vibrate(15);
                    if (zone === 'top') {
                        Parrot.lock('pet_head', 0);
                        Parrot.showHand('images/hand_pet.png', lx, ly);
                    } else if (zone === 'mid') {
                        Parrot.lock('pet_front', 0);
                        Parrot.showHand('images/hand_scratch_down.png', lx, ly);
                    } else {
                        Parrot.lock('laying', 0);
                        Parrot.showHand('images/hand_scratch_up.png', lx, ly);
                    }
                } else {
                    const handSrc = zone === 'top' ? 'images/hand_pet.png' : zone === 'mid' ? 'images/hand_scratch_down.png' : 'images/hand_scratch_up.png';
                    Parrot.showHand(handSrc, lx, ly);
                }
            }

            function doScrubMove(e) {
                if (!scrub) {
                    scrub = { moveDist: 0, lastX: e.clientX, lastY: e.clientY, progress: 0 };
                    Parrot.showProgress(0);
                    Parrot.lock(activeKey === 'bath' ? 'laying' : 'curious', 0);
                }
                const dx = e.clientX - scrub.lastX, dy = e.clientY - scrub.lastY;
                scrub.moveDist += Math.sqrt(dx * dx + dy * dy);
                scrub.lastX = e.clientX; scrub.lastY = e.clientY;
                scrub.progress = Math.min(1, scrub.moveDist / 210);
                Parrot.showProgress(scrub.progress);

                const { lx, ly } = localCoords(e.clientX, e.clientY);
                Parrot.showHand('images/hand_scratch_down.png', lx, ly);
            }

            function resetInteraction() {
                Parrot.hideHand();
                Parrot.hideProgress();
                scrub = null;
                petZone = null;
                Parrot.unlock();
            }

            function onUp(e) {
                if (pending) { pending = null; return; }

                // End direct pet tracking
                if (isDirectHover) {
                    isDirectHover = false;
                    Parrot.hideHand();
                    Parrot.unlock();
                }

                if (!activeKey) return;
                const key = activeKey;
                const itype = ITEMS[key].interaction;
                const over = overParrot(e.clientX, e.clientY);

                ghostEl.style.display = 'none';
                zoneEl.classList.remove('drag-hover');
                Parrot.hideHand();
                Parrot.hideProgress();
                activeKey = null;

                if (over) {
                    if (itype === 'drop') {
                        applyDrop(key);
                    } else if (itype === 'pet') {
                        applyPet(key, petZone);
                    } else if (itype === 'scrub') {
                        if (scrub && scrub.progress >= 0.98) {
                            applyScrub(key);
                        } else {
                            FX.floatText('Keep scrubbing!', '#f5c842', 150, 200);
                            Parrot.unlock();
                        }
                    }
                } else {
                    Parrot.unlock();
                }

                scrub = null; petZone = null;
            }

            // ── Interaction outcomes ──

            function triggerDirectPet(e) {
                // Triggered by vigorously moving pointer over parrot
                canDirectPet = false;
                directPetDist = 0;

                State.modStat('happy', 5); // smaller increment than item pet
                Audio.sfx.pet();
                if (navigator.vibrate) navigator.vibrate(40);
                FX.burst('💛', 190 + (Math.random() * 20 - 10), 230 + (Math.random() * 20 - 10), 3);

                // Set cooldown
                clearTimeout(directPetCooldownTimer);
                directPetCooldownTimer = setTimeout(() => {
                    canDirectPet = true;
                }, 3000); // 3 sec cooldown between direct pets
                HUD.updateStats();
            }

            function checkCraving(key) {
                const thought = Parrot.getThought();
                if (thought && thought.type === 'item' && thought.value === key) {
                    Parrot.clearThought();
                    State.modStat('happy', 35);
                    State.addCoins(25);
                    HUD.updateCoins();
                    Audio.sfx.coin();
                    FX.burst('✨', 190, 200, 8);
                    FX.floatText('Craving satisfied! +25 Coins', '#f5c842', 90, 180);
                }
            }

            // Helper: apply bond delta and handle milestone celebrations
            function applyBond(delta) {
                const milestone = State.modBond(delta);
                if (milestone !== null) {
                    const msgs = {
                        25: ['🌟 New Friends!', '+30 Coins'],
                        50: ['💖 Best Buds!', '+50 Coins'],
                        75: ['🏆 True Bond!', '+75 Coins'],
                        100: ['👑 Soulmates!', '+100 Coins'],
                    };
                    const reward = milestone;
                    State.addCoins(reward);
                    HUD.updateCoins();
                    const [title, coinText] = msgs[milestone];
                    FX.floatText(title, '#f5c842', 130, 170);
                    FX.floatText(coinText, '#f5c842', 130, 195);
                    FX.burst('✨', 190, 210, 12);
                    Parrot.showThought('text', '🥰');
                }
                HUD.updateBond();
            }

            function applyDrop(key) {
                if (!State.useItem(key)) return;
                const effects = ITEMS[key].statEffect;
                const statLabels = { hunger: 'Fed!', happy: 'Happy!', clean: 'Clean!', health: 'Healthy!' };
                const statColors = { hunger: '#e08020', happy: '#e04080', clean: '#40a0e0', health: '#40c050' };
                const statEmojis = { hunger: '🍩', happy: '💛', clean: '✨', health: '💚' };

                for (const [stat, delta] of Object.entries(effects)) {
                    const before = State.get().stats[stat];
                    State.modStat(stat, delta);
                    const gained = State.get().stats[stat] - before;
                    if (gained > 0) {
                        FX.floatText(statEmojis[stat] + ' ' + statLabels[stat], statColors[stat],
                            140 + Math.random() * 60 - 30, 220 + Math.random() * 30);
                    }
                }

                if (key === 'food' || key === 'snack') {
                    Audio.sfx.eat();
                    Parrot.lock('curious', 1800);
                    FX.burst('🍩', 180, 240, 5);
                } else if (key === 'vitamins') {
                    Audio.sfx.heal();
                    Parrot.lock('tilting', 2000);
                    FX.burst('✨', 180, 220, 6);
                } else if (key === 'medical_kit') {
                    Audio.sfx.heal();
                    Parrot.lock('pet_head', 2500);
                    FX.burst('💚', 180, 220, 6);
                } else if (key === 'playing_toy') {
                    Audio.sfx.happy();
                    Parrot.lock('curious', 900);
                    FX.burst('🎉', 190, 220, 4);
                    setTimeout(() => Parrot.lock('lifting', 1800), 900);
                }

                checkCraving(key);
                applyBond(1);

                Parrot.bounce();
                if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
                HUD.updateStats();
                Tray.render();
            }

            function applyPet(key, zone) {
                const delta = zone === 'top' ? 15 : zone === 'mid' ? 12 : 8;
                State.modStat('happy', delta);
                Audio.sfx.chirp();
                if (navigator.vibrate) navigator.vibrate(30);
                FX.burst('💛', 190, 240, 5);
                FX.floatText('💛 Happy!', '#e04080', 140, 250);

                checkCraving(key);
                applyBond(2); // petting builds more bond

                Parrot.bounce();
                setTimeout(() => Parrot.unlock(), 1000);
                HUD.updateStats();
            }

            function applyScrub(key) {
                if (!State.useItem(key)) return;
                const effects = ITEMS[key].statEffect;
                for (const [stat, delta] of Object.entries(effects)) State.modStat(stat, delta);

                if (key === 'bath') {
                    Audio.sfx.splash();
                    FX.burst('💧', 190, 240, 9);
                    FX.floatText('✨ Squeaky Clean!', '#40a0e0', 120, 250);
                    Parrot.lock('curious', 2500);
                } else {
                    Audio.sfx.eat();
                    FX.burst('✨', 190, 230, 6);
                    FX.floatText('✨ Clean!', '#40a0e0', 150, 250);
                    Parrot.lock('idle', 1500);
                }

                checkCraving(key);
                applyBond(1);

                Parrot.bounce();
                if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
                setTimeout(() => Parrot.unlock(), 2600);
                HUD.updateStats();
                Tray.render();
            }

            return { init, start };
        })();

                render();
                showFlash('Purchased!');

            const layer = document.getElementById('vanity-layer');
            layer.innerHTML = '';
            const equipped = State.getEquippedVanity();
            for (const key of equipped) {
                const item = VANITY_ITEMS[key];
                if (item && item.style) {
                    const img = document.createElement('img');
                    img.src = item.img;
                    img.alt = item.label;
                    img.style.cssText = `position: absolute; pointer-events: none; z-index: 2; ${item.style}`;
                    layer.appendChild(img);
                }
            }
        }

        function applyFurniture() {
            const layer = document.getElementById('furniture-layer');
            if (!layer) return;
            layer.innerHTML = '';

            // Carpet (floor, rendered first so it's behind everything)
            const activeCarpet = State.getActiveCarpet();
            if (activeCarpet) {
                const carpetVariant = CARPET_VARIANTS.find(c => c.key === activeCarpet);
                if (carpetVariant) {
                    const img = document.createElement('img');
                    img.src = carpetVariant.img;
                    img.style.cssText = carpetVariant.css;
                    layer.appendChild(img);
                }

            if (cageLevel > 0) {

            }

            const perchLevel = State.getFurnitureLevel('perch');
