            function makeFlipper(img, key) {
                const oc = document.createElement('canvas');
                oc.width = img.naturalWidth;
                oc.height = img.naturalHeight;
                const octx = oc.getContext('2d');
                octx.translate(0, img.naturalHeight);
                octx.scale(1, -1);
                octx.drawImage(img, 0, 0);
                flippedCanvas[key] = oc;
            }

            function preload() {
                for (const [k, src] of Object.entries(imgMap)) {
                    const image = new Image();
                    image.src = src;
                    imgs[k] = image;
                    if (k === 'rock_pillar' || k === 'wood_pillar') {
                        image.onload = () => makeFlipper(image, k);
                        // In case already cached
                        if (image.complete && image.naturalWidth) makeFlipper(image, k);
                    }
                }
            }

            function init() {
                canvas = document.getElementById('flappy-canvas');
                ctx = canvas.getContext('2d');
                canvas.width = W; canvas.height = H;

                canvas.addEventListener('pointerdown', tap);
                document.addEventListener('keydown', e => {
                    if (e.code === 'Space' && Screens.current() === 'flappy') { e.preventDefault(); tap(); }
                });

                preload();
            }

            function reset() {
                bird = { y: H / 2, vy: 0, angle: 0, spinAngle: 0 };
                pipes = [];
                seeds = [];
                clouds = [
                    { x: 80, y: 70, w: 90, spd: 0.38 },
                    { x: 250, y: 45, w: 65, spd: 0.22 },
                    { x: 390, y: 110, w: 105, spd: 0.32 },
                    { x: 160, y: 130, w: 75, spd: 0.28 },
                ];
                score = 0; coinsEarned = 0; frame = 0;
                PIPE_SPD = 1.9;
                running = true; started = false; dead = false;
                birdState = 'idle'; birdStateTimer = 0;
                updateCoinsDisplay();
            }

            function startGame() {
                if (rafId) cancelAnimationFrame(rafId);
                reset();
                loop();
            }

            function stop() {
                if (running && !dead) {
                    if (coinsEarned > 0) {
                        State.addCoins(coinsEarned);
                        HUD.updateCoins();
                        coinsEarned = 0;
                    }
                    if (score > 0) {
                        State.setHighScore(score);
                        if (window.Cloud) Cloud.submitScore('flappy', score);
                    }
                }
                running = false;
                if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            }

            function tap() {
                Audio.sfx.flap();
                if (dead) { startGame(); return; }
                if (!started) started = true;
                bird.vy = FLAP_V;
                setBirdState('happy', 220);
            }

            function setBirdState(s, dur) {
                birdState = s;
                if (dur) { clearTimeout(birdStateTimer); birdStateTimer = setTimeout(() => { if (birdState === s) birdState = 'idle'; }, dur); }
            }

            function spawnPipe() {
                const minTop = 75, maxTop = H - PIPE_GAP - 75;
                const topH = minTop + Math.random() * (maxTop - minTop);
                const pillarType = pipes.length % 2 === 0 ? 'rock_pillar' : 'wood_pillar';
                pipes.push({ x: W + 10, topH, bottomY: topH + PIPE_GAP, passed: false, pillarType });
                if (Math.random() < 0.65)
                    seeds.push({ x: W + 10 + PIPE_W / 2, y: topH + PIPE_GAP / 2, done: false });
            }

            function loop() {
                if (!running) return;
                update(); draw();
                rafId = requestAnimationFrame(loop);
            }

            function update() {
                if (!started || dead) return;
                frame++;

                // Bird
                bird.vy += GRAV;
                bird.y += bird.vy;
                bird.angle = Math.max(-28, Math.min(78, bird.vy * 3.8));

                // Auto state
                if (!dead) {
                    if (bird.vy < -3.5) setBirdState('happy', 0);
                    else if (bird.vy > 6) setBirdState('focused', 0);
                    else birdState = 'idle';
                }

                // Pipes — progressive coin rewards
                if (frame % SPAWN_INT === 0) spawnPipe();
                for (const p of pipes) {
                    p.x -= PIPE_SPD;
                    if (!p.passed && p.x + PIPE_W < BX) {
                        p.passed = true; score++;
                        // Increase game speed slightly per pipe
                        PIPE_SPD += 0.04;
                        // Scale coins by score tier, but cut in half
                        const bonus = Math.min(4, Math.floor(score / 5));
                        const earned = Math.max(1, Math.floor((1 + bonus) / 2));
                        coinsEarned += earned;
                        Audio.sfx.coin();
                        // Score milestones: give extra burst of coins (halved)
                        if (score === 10) { coinsEarned += 7; }
                        else if (score === 25) { coinsEarned += 15; }
                        else if (score === 50) { coinsEarned += 30; }
                        updateCoinsDisplay();
                    }
                }
                pipes = pipes.filter(p => p.x + PIPE_W > -5);

                // Seeds
                for (const s of seeds) {
                    if (s.done) continue;
                    s.x -= PIPE_SPD;
                    const dx = s.x - (BX + BW / 2), dy = s.y - (bird.y + BH / 2);
                    if (Math.abs(dx) < 26 && Math.abs(dy) < 26) {
                        s.done = true; coinsEarned += 1; Audio.sfx.coin(); updateCoinsDisplay(); // 1 coin instead of 2
                    }
                }
                seeds = seeds.filter(s => s.x > -5);

                // Clouds
                for (const c of clouds) {
                    c.x -= c.spd;
                    if (c.x + c.w < 0) { c.x = W + 20; c.y = 35 + Math.random() * 120; }
                }

                // Collision (generous hitbox)
                const bx = BX + 14, by = bird.y + 10, bw = BW - 26, bh = BH - 18;
                for (const p of pipes) {
                    const inX = bx < p.x + PIPE_W && bx + bw > p.x;
                    if (inX && (by < p.topH || by + bh > p.bottomY)) { die(); return; }
                }
                if (bird.y + BH > H - 38 || bird.y < -10) { die(); return; }
            }

            function die() {
                dead = true;
                running = true; // keep rendering
                birdState = 'back';
                Audio.sfx.hit();

                State.modStat('hunger', -10);
                State.modStat('clean', -10);
                let currentHealth = State.get().stats.health || 80;
                let targetHealth = Math.max(10, currentHealth - 15);
                State.modStat('health', targetHealth - currentHealth);
                HUD.updateStats();

                // Base end bonus + score-based multiplier
                const endBonus = 5 + Math.floor(score * 1.5);
                const total = coinsEarned + endBonus;
                coinsEarned = total;
                State.addCoins(total);
                State.setHighScore(score);
                if (window.Cloud) Cloud.submitScore('flappy', score);
                State.modBond(Math.min(5, Math.floor(score / 5) + 1)); // bond grows from playing
                HUD.updateCoins();
                HUD.updateBond();
            }

            function updateCoinsDisplay() {
                const el = document.getElementById('flappy-coins-earned');
                if (el) el.textContent = coinsEarned;
            }

            // ── Draw helpers ──

            function drawPipe(p) {
                const pillarImg = imgs[p.pillarType] || imgs.rock_pillar;
                if (!pillarImg?.complete || !pillarImg.naturalWidth) return;
                ctx.imageSmoothingEnabled = false;

                // Top pipe — use pre-rendered flipped canvas so no per-frame transform needed
                const topH = p.topH;
                if (topH > 0) {
                    const fc = flippedCanvas[p.pillarType];
                    if (fc) {
                        ctx.drawImage(fc, p.x, 0, PIPE_W, topH);
                    } else {
                        // Fallback until offscreen ready
                        ctx.save();
                        ctx.translate(p.x + PIPE_W / 2, topH / 2);
                        ctx.scale(1, -1);
                        ctx.drawImage(pillarImg, -PIPE_W / 2, -topH / 2, PIPE_W, topH);
                        ctx.restore();
                    }
                }

                // Bottom pipe — draw normally
                const botH = H - p.bottomY;
                if (botH > 0) {
                    ctx.drawImage(pillarImg, p.x, p.bottomY, PIPE_W, botH);
                }
            }

            function drawCloud(c) {
                ctx.save();
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.beginPath();
                ctx.ellipse(c.x + c.w * 0.5, c.y, c.w * 0.5, c.w * 0.22, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath();
                ctx.ellipse(c.x + c.w * 0.3, c.y - 9, c.w * 0.25, c.w * 0.19, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath();
                ctx.ellipse(c.x + c.w * 0.72, c.y - 7, c.w * 0.3, c.w * 0.2, 0, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            function draw() {
                // Sky
                const sky = ctx.createLinearGradient(0, 0, 0, H - 38);
                sky.addColorStop(0, '#4ab4f0');
                sky.addColorStop(0.7, '#a8dcf8');
                sky.addColorStop(1, '#c8eeff');
                ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

                // Clouds
                clouds.forEach(drawCloud);

                // Pipes
                pipes.forEach(drawPipe);

                // Seeds (coins)
                for (const s of seeds) {
                    if (s.done) continue;
                    ctx.save();
                    ctx.imageSmoothingEnabled = false;
                    if (imgs.coin?.complete && imgs.coin.naturalWidth) {
                        ctx.shadowColor = '#f5c842'; ctx.shadowBlur = 8;
                        ctx.drawImage(imgs.coin, s.x - 12, s.y - 12, 24, 24);
                    } else {
                        ctx.shadowColor = '#f5c842'; ctx.shadowBlur = 10;
                        ctx.fillStyle = '#f5c842';
                        ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.restore();
                }

                // Ground
                ctx.fillStyle = '#58882a';
                ctx.fillRect(0, H - 38, W, 38);
                ctx.fillStyle = '#488020';
                ctx.fillRect(0, H - 38, W, 7);
                ctx.fillStyle = '#68a038';
                for (let gx = 0; gx < W; gx += 22) ctx.fillRect(gx, H - 38, 11, 6);

                // Bird
                const bimg = imgs[birdState] || imgs.idle;
                ctx.save();
                ctx.translate(BX + BW / 2, bird.y + BH / 2);
                if (dead) {
                    bird.spinAngle = (bird.spinAngle || 0) + 5;
                    ctx.rotate(bird.spinAngle * Math.PI / 180);
                } else {
                    ctx.rotate(bird.angle * Math.PI / 180);
                }
                ctx.imageSmoothingEnabled = false;
                if (bimg?.complete) ctx.drawImage(bimg, -BW / 2, -BH / 2, BW, BH);
                ctx.restore();

                ctx.textAlign = 'center';
                ctx.font = '11px "Press Start 2P", monospace';

                // Start prompt
                if (!started && !dead) {
                    ctx.fillStyle = 'rgba(0,0,0,0.48)';
                    ctx.fillRect(0, H / 2 - 54, W, 108);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText('TAP TO FLY', W / 2, H / 2 - 10);
                    ctx.font = '7px "Press Start 2P", monospace';
                    ctx.fillStyle = '#f5c842';
                    ctx.fillText('earn coins \u2022 spend in shop', W / 2, H / 2 + 20);
                    ctx.fillStyle = '#90c8ff';
                    ctx.fillText('avoid the perches!', W / 2, H / 2 + 44);
                }

                // Death screen
                if (dead) {
                    ctx.fillStyle = 'rgba(0,0,0,0.62)';
                    ctx.fillRect(0, H / 2 - 88, W, 180);
                    ctx.fillStyle = '#ff6868';
                    ctx.font = '20px "Press Start 2P", monospace';
                    ctx.fillText('BONK!', W / 2, H / 2 - 46);
                    ctx.fillStyle = '#f5c842';
                    ctx.font = '9px "Press Start 2P", monospace';
                    ctx.fillText('coins earned: ' + coinsEarned, W / 2, H / 2 - 8);
                    ctx.fillStyle = '#88d888';
                    ctx.font = '7px "Press Start 2P", monospace';
                    ctx.fillText('best score: ' + State.get().highScore, W / 2, H / 2 + 18);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '8px "Press Start 2P", monospace';
                    ctx.fillText('tap to try again', W / 2, H / 2 + 56);
                }

                // Live score
                if (started && !dead) {
                    ctx.fillStyle = 'rgba(0,0,0,0.32)';
                    ctx.fillRect(W / 2 - 40, 8, 80, 30);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '13px "Press Start 2P", monospace';
                    ctx.fillText(score, W / 2, 29);
                }
            }

            return { init, startGame, stop };
        })();

        // ════════════════════════════════════════════════
        // JUMP GAME
        // ════════════════════════════════════════════════

        const Jump = (() => {
            const W = 480, H = 664;
            const GRAV = 0.15;
            const JUMP_V = -7.5;
            const BW = 72, BH = 60;

            let canvas, ctx;
            let bird, platforms, bgStars;
            let score, coinsEarned, frame, highestCamY;
            let running, started, dead;
            let rafId = null;
            let pointerX = W / 2, lastPointerX = W / 2, isPointerDown = false;
            let keys = { ArrowLeft: false, ArrowRight: false, KeyA: false, KeyD: false };
            let birdState = 'idle';
            let birdStateTimer = 0;

            const imgs = {};
            const imgMap = {
                idle: 'images/parrot_flying_idle.png',
                happy: 'images/parrot_flying_happy.png',
                scared: 'images/parrot_flying_scared.png',
                focused: 'images/parrot_flying_focused.png',
                back: 'images/parrot_flying_back.png',
                plank: 'images/plank.png',
                cracked_plank: 'images/cracked_plank.png',
                log: 'images/log.png',
                coin: 'images/coin.png',
            };

            function preload() {
                for (const [k, src] of Object.entries(imgMap)) {
                    imgs[k] = new Image(); imgs[k].src = src;
                }
            }

            function init() {
                canvas = document.getElementById('jump-canvas');
                ctx = canvas.getContext('2d');
                canvas.width = W; canvas.height = H;

                document.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
                document.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

                canvas.addEventListener('pointerdown', e => {
                    const rect = canvas.getBoundingClientRect();
                    pointerX = (e.clientX - rect.left) / (rect.width / W);
                    lastPointerX = pointerX;
                    isPointerDown = true;
                    if (dead) { startGame(); return; }
                    if (!started) {
                        started = true; bird.vy = JUMP_V; Audio.sfx.flap(); setBirdState('focused', 400);
                    }
                });
                canvas.addEventListener('pointermove', e => {
                    if (isPointerDown) {
                        const rect = canvas.getBoundingClientRect();
                        pointerX = (e.clientX - rect.left) / (rect.width / W);
                    }
                });
                canvas.addEventListener('pointerup', () => isPointerDown = false);
                canvas.addEventListener('pointercancel', () => isPointerDown = false);

                preload();
            }

            function reset() {
                bird = { x: W / 2, y: H - 150, vx: 0, vy: 0, spinAngle: 0 };
                platforms = [];
                bgStars = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 1 }));

                // Initial floor
                platforms.push({ x: W / 2, y: H - 20, w: W, type: 'start', vx: 0 });
                // Initial gen
                let py = H - 150;
                while (py > -H) {
                    spawnPlatform(py);
                    py -= 50 + Math.random() * 40;
                }

                score = 0; coinsEarned = 0; frame = 0;
                highestCamY = bird.y;
                running = true; started = false; dead = false;
                birdState = 'idle'; birdStateTimer = 0;
                updateCoinsDisplay();
            }

            function spawnPlatform(y) {
                // Determine difficulty based on height (negative y is higher)
                const difficulty = Math.min(1, Math.max(0, -y / 15000));

                let type = 'normal';
                const r = Math.random();
                if (r < difficulty * 0.45) type = 'moving';
                else if (r < difficulty * 0.8) type = 'fragile';

                // Base width gets smaller
                const w = Math.max(40, 80 - difficulty * 30);
                const vx = type === 'moving' ? (Math.random() > 0.5 ? 1 : -1) * (1 + difficulty * 2.5) : 0;

                // Add coins randomly (roughly 1 in 3 platforms)
                const hasCoin = Math.random() < 0.33;

                platforms.push({ x: 20 + Math.random() * (W - 40 - w) + w / 2, y, w, type, vx, broken: false, hasCoin, coinCollected: false });
            }

            function startGame() {
                if (rafId) cancelAnimationFrame(rafId);
                reset();
                loop();
            }

            function stop() {
                if (running && !dead) {
                    if (coinsEarned > 0) {
                        State.addCoins(coinsEarned);
                        HUD.updateCoins();
                        coinsEarned = 0;
                    }
                    if (score > 0) {
                        State.setHighScoreJump(score);
                        if (window.Cloud) Cloud.submitScore('jump', score);
                    }
                }
                running = false;
                if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            }

            function setBirdState(s, dur) {
                birdState = s;
                if (dur) {
                    clearTimeout(birdStateTimer);
                    birdStateTimer = setTimeout(() => { if (birdState === s) birdState = 'idle'; }, dur);
                }
            }

            function loop() {
                if (!running) return;
                update(); draw();
                rafId = requestAnimationFrame(loop);
            }

            function update() {
                if (!started || dead) return;
                frame++;

                // Controls
                if (isPointerDown) {
                    const dx = pointerX - lastPointerX;
                    bird.x += dx * 1.5;
                    if (Math.abs(dx) > 0.5) {
                        bird.vx = dx * 0.4;
                    }
                    lastPointerX = pointerX;
                }

                if (keys.ArrowLeft || keys.KeyA) bird.vx -= 0.8;
                if (keys.ArrowRight || keys.KeyD) bird.vx += 0.8;

                // Friction / max speed
                bird.vx *= 0.85;
                if (bird.vx > 10) bird.vx = 10;
                if (bird.vx < -10) bird.vx = -10;

                // Physics
                bird.vy += GRAV;
                bird.x += bird.vx;
                bird.y += bird.vy;

                // Wrap around X
                if (bird.x < -BW / 2) bird.x = W + BW / 2;
                if (bird.x > W + BW / 2) bird.x = -BW / 2;

                // Camera follows bird up
                if (bird.y < highestCamY) {
                    highestCamY = bird.y;
                    let currentScore = Math.floor((H - 150 - highestCamY) / 100);
                    if (currentScore > score) {
                        score = currentScore;
                    }
                }

                // Auto state
                if (!dead) {
                    if (bird.vy < -3) setBirdState('focused', 0);
                    else if (bird.vy > 5) setBirdState('back', 0);
                    else birdState = 'idle';
                }

                // Update platforms
                // Only keep platforms relatively near camera
                const bottomCamLimit = highestCamY + H + 100;
                let highestPlatY = bottomCamLimit;

                for (let i = platforms.length - 1; i >= 0; i--) {
                    let p = platforms[i];
                    if (p.y > bottomCamLimit) {
                        platforms.splice(i, 1);
                        continue;
                    }
                    if (p.y < highestPlatY) highestPlatY = p.y;

                    if (p.type === 'moving') {
                        p.x += p.vx;
                        if (p.x - p.w / 2 < 0 || p.x + p.w / 2 > W) p.vx *= -1;
                    }

                    // Collect coin
                    if (p.hasCoin && !p.coinCollected && !dead) {
                        const dx = bird.x - p.x;
                        const dy = bird.y - (p.y - 18);
                        if (dx * dx + dy * dy < 900) { // 30px radius squared
                            p.coinCollected = true;
                            coinsEarned++;
                            Audio.sfx.coin();
                            updateCoinsDisplay();
                        }
                    }

                    // Collision (only when falling)
                    if (bird.vy > 0 && !p.broken) {
                        const hitX = bird.x > p.x - p.w / 2 - BW / 3 && bird.x < p.x + p.w / 2 + BW / 3;
                        const hitY = bird.y + BH / 2 > p.y - 10 && bird.y + BH / 2 < p.y + 15;
                        if (hitX && hitY) {
                            bird.y = p.y - BH / 2;
                            bird.vy = JUMP_V;
                            Audio.sfx.flap();
                            setBirdState('happy', 300);
                            if (p.type === 'fragile') {
                                p.broken = true;
                                Audio.sfx.eat(); // crack sound proxy
                            }
                        }
                    }
                }

                // Infinite generation upwards
                while (highestPlatY > highestCamY - H) {
                    highestPlatY -= 45 + Math.random() * 55;
                    spawnPlatform(highestPlatY);
                }

                // Death
                if (bird.y > highestCamY + H) {
                    die();
                }
            }

            function die() {
                dead = true;
                birdState = 'scared';
                Audio.sfx.hit();

                State.modStat('hunger', -10);
                State.modStat('clean', -10);
                let currentHealth = State.get().stats.health || 80;
                let targetHealth = Math.max(10, currentHealth - 15);
                State.modStat('health', targetHealth - currentHealth);
                HUD.updateStats();

                // End bonus scales with score: +5 base + score * 2
                const endBonus = 5 + Math.floor(score * 2);
                const total = coinsEarned + endBonus;
                State.addCoins(total);
                State.setHighScoreJump(score);
                if (window.Cloud) Cloud.submitScore('jump', score);
                State.modBond(Math.min(5, Math.floor(score / 10) + 1)); // bond grows from altitude
                HUD.updateCoins();
                HUD.updateBond();
            }


            function updateCoinsDisplay() {
                const el = document.getElementById('jump-coins-earned');
                if (el) el.textContent = coinsEarned;
            }

            function draw() {
                // Calculate gradient based on height
                // highestCamY starts at ~500. Goes negative.
                const bgProgress = Math.min(1, Math.max(0, -highestCamY / 20000));

                // Color mapping: 
                // 0.0 -> Ground (cyan/blue)
                // 0.5 -> High sky (deep blue)
                // 1.0 -> Space (black/purple)

                const rTop = Math.floor(74 * (1 - bgProgress) + 10 * bgProgress);
                const gTop = Math.floor(180 * (1 - bgProgress) + 10 * bgProgress);
                const bTop = Math.floor(240 * (1 - bgProgress) + 26 * bgProgress);

                const rBot = Math.floor(200 * (1 - bgProgress) + 40 * bgProgress);
                const gBot = Math.floor(238 * (1 - bgProgress) + 40 * bgProgress);
                const bBot = Math.floor(255 * (1 - bgProgress) + 80 * bgProgress);

                const bg = ctx.createLinearGradient(0, 0, 0, H);
                bg.addColorStop(0, `rgb(${rTop},${gTop},${bTop})`);
                bg.addColorStop(1, `rgb(${rBot},${gBot},${bBot})`);
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, W, H);

                // Coordinate transform for camera
                // We want highestCamY to be at ~ H * 0.4 on screen
                const camOffsetY = H * 0.4 - highestCamY;

                // Stars (parallax)
                if (bgProgress > 0.1) {
                    ctx.fillStyle = `rgba(255,255,255,${(bgProgress - 0.1) * 1.5})`;
                    bgStars.forEach(s => {
                        let sy = (s.y + camOffsetY * 0.1) % H;
                        if (sy < 0) sy += H;
                        ctx.beginPath(); ctx.arc(s.x, sy, s.s, 0, Math.PI * 2); ctx.fill();
                    });
                }

                ctx.save();
                ctx.translate(0, camOffsetY);

                // Draw platforms
                ctx.imageSmoothingEnabled = false;
                platforms.forEach(p => {
                    if (p.broken) return;
                    const ph = 14;   // standard height
                    const phBig = 18; // bigger height for plank/cracked
                    if (p.type === 'start') {
                        ctx.fillStyle = '#58882a';
                        ctx.fillRect(p.x - p.w / 2, p.y, p.w, H);
                    } else if (p.type === 'normal') {
                        // Normal = log
                        const img = imgs.log;
                        if (img?.complete && img.naturalWidth) {
                            ctx.drawImage(img, p.x - p.w / 2, p.y, p.w, ph);
                        } else {
                            ctx.fillStyle = '#58882a';
                            ctx.fillRect(p.x - p.w / 2, p.y, p.w, ph);
                        }
                    } else if (p.type === 'moving') {
                        // Moving = plank (slightly bigger)
                        const img = imgs.plank;
                        if (img?.complete && img.naturalWidth) {
                            ctx.drawImage(img, p.x - p.w / 2, p.y, p.w, phBig);
                        } else {
                            ctx.fillStyle = '#3878b8';
                            ctx.fillRect(p.x - p.w / 2, p.y, p.w, phBig);
                        }
                    } else if (p.type === 'fragile') {
                        // Fragile = cracked plank (slightly bigger)
                        const img = imgs.cracked_plank;
                        if (img?.complete && img.naturalWidth) {
                            ctx.drawImage(img, p.x - p.w / 2, p.y, p.w, phBig);
                        } else {
                            ctx.fillStyle = '#8B5a28';
                            ctx.fillRect(p.x - p.w / 2, p.y, p.w, phBig);
                        }
                    }

                    // Draw coin
                    if (p.hasCoin && !p.coinCollected) {
                        ctx.save();
                        ctx.imageSmoothingEnabled = false;
                        if (imgs.coin?.complete && imgs.coin.naturalWidth) {
                            ctx.shadowColor = '#f5c842'; ctx.shadowBlur = 8;
                            ctx.drawImage(imgs.coin, p.x - 10, p.y - 28, 20, 20);
                        } else {
                            ctx.shadowColor = '#f5c842'; ctx.shadowBlur = 10;
                            ctx.fillStyle = '#f5c842';
                            ctx.beginPath(); ctx.arc(p.x, p.y - 18, 7, 0, Math.PI * 2); ctx.fill();
                        }
                        ctx.restore();
                    }
                });

                // Bird
                const bimg = imgs[birdState] || imgs.idle;
                ctx.save();
                ctx.translate(bird.x, bird.y);
                if (dead) {
                    bird.spinAngle = (bird.spinAngle || 0) + 8;
                    ctx.rotate(bird.spinAngle * Math.PI / 180);
                } else if (bird.vx !== 0) {
                    ctx.scale(bird.vx > 0 ? -1 : 1, 1);
                }
                ctx.imageSmoothingEnabled = false;
                if (bimg?.complete) ctx.drawImage(bimg, -BW / 2, -BH / 2, BW, BH);
                ctx.restore();

                ctx.restore(); // end camera transform

                ctx.textAlign = 'center';

                // UI overlays
                if (!started && !dead) {
                    ctx.fillStyle = 'rgba(0,0,0,0.48)';
                    ctx.fillRect(0, H / 2 - 54, W, 108);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '11px "Press Start 2P", monospace';
                    ctx.fillText('TAP TO JUMP', W / 2, H / 2 - 10);
                    ctx.font = '7px "Press Start 2P", monospace';
                    ctx.fillStyle = '#f5c842';
                    ctx.fillText('tilt or use arrows to move', W / 2, H / 2 + 20);
                    ctx.fillStyle = '#f890c8';
                    ctx.fillText('go as high as you can!', W / 2, H / 2 + 44);
                }

                if (dead) {
                    ctx.fillStyle = 'rgba(0,0,0,0.62)';
                    ctx.fillRect(0, H / 2 - 88, W, 180);
                    ctx.fillStyle = '#ff6868';
                    ctx.font = '20px "Press Start 2P", monospace';
                    ctx.fillText('FELL!', W / 2, H / 2 - 46);
                    ctx.fillStyle = '#f5c842';
                    ctx.font = '9px "Press Start 2P", monospace';
                    ctx.fillText('coins earned: ' + coinsEarned, W / 2, H / 2 - 8);
                    ctx.fillStyle = '#c8eeff';
                    ctx.font = '7px "Press Start 2P", monospace';
                    ctx.fillText('height reached: ' + score + 'm', W / 2, H / 2 + 18);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '8px "Press Start 2P", monospace';
                    ctx.fillText('tap to try again', W / 2, H / 2 + 56);
                }

                if (started && !dead) {
                    ctx.fillStyle = 'rgba(0,0,0,0.32)';
                    ctx.fillRect(W / 2 - 40, 8, 80, 30);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px "Press Start 2P", monospace';
                    ctx.fillText(score + 'm', W / 2, 28);
                }
            }

            return { init, startGame, stop };
        })();

        // ════════════════════════════════════════════════
        // INTRO STARS
        // ════════════════════════════════════════════════

        function initIntroStars() {
            const canvas = document.getElementById('intro-canvas');
            const ctx = canvas.getContext('2d');
            const t0 = Date.now();
            const stars = Array.from({ length: 70 }, () => ({
                x: Math.random() * 480,
                y: Math.random() * 720,
                r: Math.random() * 1.6 + 0.4,
                spd: Math.random() * 0.5 + 0.1,
                phase: Math.random() * Math.PI * 2,
            }));
            let rafId;
            function draw() {
                ctx.clearRect(0, 0, 480, 720);
                const t = (Date.now() - t0) / 1000;
                for (const s of stars) {
                    const a = 0.35 + 0.65 * Math.sin(t * s.spd + s.phase);
                    ctx.fillStyle = `rgba(255,250,200,${a.toFixed(2)})`;
                    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
                }
                rafId = requestAnimationFrame(draw);
            }
            draw();
            return () => cancelAnimationFrame(rafId);
        }

        // ════════════════════════════════════════════════
        // GAME SCALING
        // ════════════════════════════════════════════════

        function scaleGame() {
            const game = document.getElementById('game');
            const sx = window.innerWidth / 480;
            const sy = window.innerHeight / 720;
            const s = Math.min(sx, sy);
            game.style.transformOrigin = 'top left';
            game.style.transform = `scale(${s})`;
            game.style.left = Math.round((window.innerWidth - 480 * s) / 2) + 'px';
            game.style.top = Math.round((window.innerHeight - 720 * s) / 2) + 'px';
        }

        // ════════════════════════════════════════════════
        // STAT DECAY (gentle real-time)
        // ════════════════════════════════════════════════

        function applyOfflineDecay() {
            const now = Date.now();
            const last = State.get().savedAt || now;
            const mins = Math.min(120, (now - last) / 60000);
            if (mins > 2) {
                State.modStat('hunger', -Math.floor(mins * 0.7));
                State.modStat('happy', -Math.floor(mins * 0.5));
                State.modStat('clean', -Math.floor(mins * 0.3));
                State.save();
            }
        }

        function startDecayLoop() {
            setInterval(() => {
                if (Screens.current() === 'main') {
                    State.modStat('hunger', -1);
                    State.modStat('happy', -1);
                    State.modStat('clean', -1);
                    HUD.updateStats();
                }
            }, 90000); // 1.5 min per point
        }

        // ════════════════════════════════════════════════
        // INIT
        // ════════════════════════════════════════════════

        window.addEventListener('DOMContentLoaded', () => {
            scaleGame();
            window.addEventListener('resize', scaleGame);

            Audio.init();
            Parrot.init();
            Drag.init();
            Flappy.init();
            Jump.init();
            Shop.init();
            applyOfflineDecay();

            Screens.register('intro', null, null);
            Screens.register('main',
                () => {
                    applyRoom(State.get().activeRoom || 'standard');
                    applyVanity(); applyFurniture(); Tray.render();
                    HUD.updateAll();
                    Parrot.startIdle();
                    // Show daily login bonus toast
                    const { bonus, streak } = State.checkDailyLogin();
                    if (bonus > 0) {
                        setTimeout(() => {
                            FX.floatText(`\uD83C\uDF1F Day ${streak} Streak!`, '#f5c842', 140, 170);
                            FX.floatText(`+${bonus} Coins`, '#f5c842', 160, 195);
                            HUD.updateCoins();
                        }, 800);
                    }
                },
                () => { Parrot.clearIdle(); }
            );
            Screens.register('shop',
                () => Shop.render(),
                null
            );
            Screens.register('flappy',
                () => { },
                () => Flappy.stop()
            );
            Screens.register('jump',
                () => { },
                () => Jump.stop()
            );

            // Main screen buttons
            document.getElementById('btn-shop').addEventListener('click', () => {
                Audio.sfx.click(); Screens.go('shop');
            });
            document.getElementById('btn-flappy').addEventListener('click', () => {
                Audio.sfx.click(); Flappy.startGame(); Screens.go('flappy');
            });
            document.getElementById('btn-jump').addEventListener('click', () => {
                Audio.sfx.click(); Jump.startGame(); Screens.go('jump');
            });

            // Shop back
            document.getElementById('shop-back-btn').addEventListener('click', () => {
                Audio.sfx.click(); Screens.go('main');
            });

            // Flappy back
            document.getElementById('flappy-back-btn').addEventListener('click', () => {
                Audio.sfx.click(); Screens.go('main');
            });

            // Jump back
            document.getElementById('jump-back-btn').addEventListener('click', () => {
                Audio.sfx.click(); Screens.go('main');
            });

            // Intro tap
            const goMain = () => { Audio.sfx.happy(); Screens.go('main'); };
            document.getElementById('screen-intro').addEventListener('pointerdown', goMain, { once: true });
            document.addEventListener('keydown', e => {
                if (Screens.current() === 'intro') goMain();
            }, { once: true });

            // Settings
            const settingsModal = document.getElementById('settings-modal');
            const confirmBox = document.getElementById('confirm-box');
            const settingsMain = document.getElementById('settings-main');

            function openSettings() {
                Audio.sfx.click();
                confirmBox.classList.remove('open');
                settingsMain.style.display = '';
                settingsModal.classList.add('open');
                document.getElementById('auth-form').style.display = 'none';
            }
            function closeSettings() {
                settingsModal.classList.remove('open');
            }

            // Auth UI Logic
            window.updateAuthUI = function () {
                const statusEl = document.getElementById('auth-status');
                const toggleBtn = document.getElementById('toggle-auth-btn');
                const formEl = document.getElementById('auth-form');

                if (Cloud.currentUser && Cloud.currentProfile) {
                    statusEl.innerHTML = `Logged in as <b>${Cloud.currentProfile.username}</b>.<br>Progress stays local until you press SAVE.`;
                    statusEl.className = 'auth-status logged-in';
                    toggleBtn.textContent = 'Log Out';
                    formEl.style.display = 'none';
                } else {
                    statusEl.innerHTML = `Not logged in yet.<br>Progress is stored only in this browser.`;
                    statusEl.className = 'auth-status';
                    toggleBtn.textContent = '🔑 Log In / Sign Up';
                }
            };

            document.getElementById('toggle-auth-btn').addEventListener('click', async () => {
                Audio.sfx.click();
                if (Cloud.currentUser) {
                    await Cloud.logout();
                } else {
                    const formEl = document.getElementById('auth-form');
                    formEl.style.display = formEl.style.display === 'flex' ? 'none' : 'flex';
                }
            });

            document.getElementById('save-btn').addEventListener('click', async () => {
                Audio.sfx.click();
                console.log('Save button clicked, Cloud:', !!window.Cloud, 'User:', Cloud?.currentUser?.id);
                if (!window.Cloud) {
                    console.error('Cloud module not available');
                    FX.floatText('Cloud unavailable', '#f08a80', 150, 90);
                    return;
                }
                if (!Cloud.currentUser) {
                    console.log('No user logged in');
                    FX.floatText('Log in to save', '#f08a80', 150, 90);
                    openSettings();
                    return;
                }
                try {
                    console.log('Starting cloud save...');
                    await Cloud.syncToCloud();
                    console.log('Cloud save completed');
                    FX.floatText('Saved to cloud!', '#50d070', 145, 90);
                } catch (error) {
                    console.error('Cloud save failed:', error);
                    FX.floatText('Save failed', '#f08a80', 155, 90);
                }
            });

            async function handleAuthAction(action) {
                Audio.sfx.click();
                const user = document.getElementById('auth-username').value.trim();
                const pass = document.getElementById('auth-password').value;
                const errEl = document.getElementById('auth-error');
                errEl.style.color = '#f5c842';
                errEl.textContent = 'Loading... please wait';

                if (!user || user.length < 3) { errEl.style.color = '#d06050'; errEl.textContent = 'Username must be >= 3 chars'; return; }
                if (!pass || pass.length < 6) { errEl.style.color = '#d06050'; errEl.textContent = 'Password must be >= 6 chars'; return; }

                try {
                    if (action === 'login') {
                        await Cloud.login(user, pass);
                    } else {
                        await Cloud.signup(user, pass);
                        // Auto-login after successful signup to update the UI
                        await Cloud.login(user, pass);
                    }
                    errEl.textContent = ''; // clear loading on success
                } catch (e) {
                    errEl.style.color = '#d06050';
                    errEl.textContent = e.message || 'Authentication error';
                }
            }

            document.getElementById('auth-login-btn').addEventListener('click', () => handleAuthAction('login'));
            document.getElementById('auth-signup-btn').addEventListener('click', () => handleAuthAction('signup'));

            // Leaderboard UI Logic
            const lbModal = document.getElementById('leaderboard-modal');
            const lbContent = document.getElementById('lb-content');
            const lbTabs = document.querySelectorAll('.lb-tab');
            let currentLbGame = 'flappy';

            async function openLeaderboard(game) {
                Audio.sfx.click();
                lbModal.classList.add('open');
                currentLbGame = game;
                updateLbTabs();
                await loadLeaderboard();
            }

            function updateLbTabs() {
                lbTabs.forEach(t => {
                    t.classList.toggle('active', t.dataset.game === currentLbGame);
                });
            }

            async function loadLeaderboard() {
                lbContent.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">Loading...</div>';
                const data = await Cloud.getLeaderboard(currentLbGame);
                if (!data || data.length === 0) {
                    lbContent.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">No scores yet!</div>';
                    return;
                }

                let html = `<div class="lb-row header"><div class="lb-rank">#</div><div class="lb-name">Player</div><div class="lb-score">Score</div></div>`;
                data.forEach((row, idx) => {
                    const isMe = Cloud.currentProfile && Cloud.currentProfile.username === row.username;
                    const nameColor = isMe ? '#50d070' : '#fff';
                    html += `<div class="lb-row">
                        <div class="lb-rank">${idx + 1}</div>
                        <div class="lb-name" style="color:${nameColor};">${row.username}</div>
                        <div class="lb-score">${row.score}</div>
                    </div>`;
                });
                lbContent.innerHTML = html;
            }

            document.querySelectorAll('.btn-leaderboard').forEach(btn => {
                btn.addEventListener('click', () => openLeaderboard(btn.dataset.game));
            });
            lbTabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    Audio.sfx.click();
                    currentLbGame = btn.dataset.game;
                    updateLbTabs();
                    loadLeaderboard();
                });
            });
            document.getElementById('lb-close-btn').addEventListener('click', () => {
                Audio.sfx.click();
                lbModal.classList.remove('open');
            });

            document.getElementById('settings-btn').addEventListener('click', openSettings);
            document.getElementById('settings-close-btn').addEventListener('click', () => { Audio.sfx.click(); closeSettings(); });

            document.getElementById('reset-btn').addEventListener('click', () => {
                Audio.sfx.click();
                settingsMain.style.display = 'none';
                confirmBox.classList.add('open');
            });
            document.getElementById('confirm-no').addEventListener('click', () => {
                Audio.sfx.click();
                confirmBox.classList.remove('open');
                settingsMain.style.display = '';
            });
            document.getElementById('confirm-yes').addEventListener('click', () => {
                Audio.sfx.click();
                State.reset();
                closeSettings();
                applyRoom('standard');
                applyVanity();
                applyFurniture();
                Tray.render();
                HUD.updateStats();
                HUD.updateBond();
                Parrot.startIdle();
            });

            // Close modal on backdrop click
            settingsModal.addEventListener('click', e => { if (e.target === settingsModal) closeSettings(); });
            lbModal.addEventListener('click', e => { if (e.target === lbModal) lbModal.classList.remove('open'); });

            if (window.Cloud) Cloud.init();
            startDecayLoop();
            initIntroStars();
            Screens.go('intro');
        });
    </script>
