<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Bluetooth Metronome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .control-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input[type="number"],
        input[type="range"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        input[type="range"] {
            padding: 0;
            height: 40px;
            cursor: pointer;
        }
        
        .value-display {
            display: inline-block;
            float: right;
            color: #667eea;
            font-weight: 700;
            font-size: 14px;
        }
        
        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        #connectBtn {
            background: #667eea;
            color: white;
        }
        
        #connectBtn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        #playBtn {
            background: #10b981;
            color: white;
        }
        
        #playBtn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }
        
        #playBtn.stopped {
            background: #ef4444;
        }
        
        #playBtn.stopped:hover {
            background: #dc2626;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status.disconnected {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .status.connected {
            background: #d1fae5;
            color: #059669;
        }
        
        .info {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }
        
        .rhythm-info {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Bluetooth Metronome</h1>
        
        <button id="connectBtn">Connect to ESP32</button>
        
        <div id="controls" style="display: none;">
            <div class="control-group">
                <label>
                    Tempo (BPM)
                    <span class="value-display" id="tempoValue">120</span>
                </label>
                <input type="number" id="tempoInput" min="30" max="300" value="120">
            </div>
            
            <div class="control-group">
                <label>
                    Volume
                    <span class="value-display" id="volumeValue">50%</span>
                </label>
                <input type="range" id="volumeSlider" min="0" max="100" value="50">
            </div>
            
            <div class="control-group">
                <label>Rhythm Pattern</label>
                <select id="rhythmSelect">
                    <option value="0">4/4 (Common time)</option>
                    <option value="1">3/4 (Waltz)</option>
                    <option value="2">6/8 (Compound)</option>
                </select>
            </div>
            
            <button id="playBtn">⏸ Pause</button>
            
            <div class="rhythm-info" id="rhythmInfo">
                Playing: 4/4
            </div>
        </div>
        
        <div class="status disconnected" id="status">
            Not connected
        </div>
        
        <div class="info">
            Requires browser with WebBluetooth support<br>
            (Chrome, Edge, or Opera recommended)<br>
            <small id="debugInfo"></small>
        </div>
    </div>

    <script>
        // BLE Service and Characteristic UUIDs
        const SERVICE_UUID = '5cc66bc5-0f1a-4cf7-9473-8edb3ff44641';
        const TEMPO_UUID = 'a7a43c53-8d94-4b60-8b60-4d19d31a0f33';
        const VOLUME_UUID = '4f9b1da9-7d68-4d81-9c8e-969f3c88fe97';
        const RHYTHM_UUID = 'f115f0e1-2a9f-492c-9b3c-1bba378a3e76';
        const PLAY_STATE_UUID = 'cc0f8f5b-808a-4ed3-b52e-3bea1962fa74';
        
        const RHYTHM_NAMES = ['4/4', '3/4', '6/8'];
        
        let device = null;
        let server = null;
        let service = null;
        let tempoChar = null;
        let volumeChar = null;
        let rhythmChar = null;
        let playStateChar = null;
        let isPlaying = true;
        
        // UI Elements
        const connectBtn = document.getElementById('connectBtn');
        const controls = document.getElementById('controls');
        const status = document.getElementById('status');
        const tempoInput = document.getElementById('tempoInput');
        const tempoValue = document.getElementById('tempoValue');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const rhythmSelect = document.getElementById('rhythmSelect');
        const playBtn = document.getElementById('playBtn');
        const rhythmInfo = document.getElementById('rhythmInfo');
        const debugInfo = document.getElementById('debugInfo');
        
        // Check WebBluetooth support and show debug info
        if (!navigator.bluetooth) {
            status.textContent = 'WebBluetooth not supported in this browser';
            connectBtn.disabled = true;
        } else {
            // Check if we're on mobile and provide specific guidance
            const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const isSecure = location.protocol === 'https:' || location.hostname === 'localhost';
            
            debugInfo.textContent = `Mobile: ${isMobile}, Secure: ${isSecure}, Browser: ${navigator.userAgent.split(' ')[0]}`;
            
            if (isMobile) {
                status.textContent = 'Mobile detected - make sure ESP32 is powered on and nearby';
            }
            
            if (!isSecure && !isMobile) {
                status.textContent = 'Warning: WebBluetooth requires HTTPS on desktop';
            }
        }
        
        // Connect to device
        connectBtn.addEventListener('click', async () => {
            try {
                status.textContent = 'Connecting...';
                status.className = 'status disconnected';
                
                // Try different connection methods for better mobile compatibility
                let deviceOptions = {
                    filters: [{ services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                };
                
                // For mobile, also try name-based filtering
                const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                if (isMobile) {
                    deviceOptions = {
                        filters: [
                            { name: "ESP32-Metronome" },
                            { namePrefix: "ESP32" }
                        ],
                        optionalServices: [SERVICE_UUID]
                    };
                }
                
                device = await navigator.bluetooth.requestDevice(deviceOptions);
                
                device.addEventListener('gattserverdisconnected', onDisconnected);
                
                server = await device.gatt.connect();
                service = await server.getPrimaryService(SERVICE_UUID);
                
                // Get all characteristics
                tempoChar = await service.getCharacteristic(TEMPO_UUID);
                volumeChar = await service.getCharacteristic(VOLUME_UUID);
                rhythmChar = await service.getCharacteristic(RHYTHM_UUID);
                playStateChar = await service.getCharacteristic(PLAY_STATE_UUID);
                
                // Read initial values
                await readInitialValues();
                
                // Subscribe to notifications
                await subscribeToNotifications();
                
                status.textContent = 'Connected to ESP32-Metronome';
                status.className = 'status connected';
                connectBtn.style.display = 'none';
                controls.style.display = 'block';
                
            } catch (error) {
                console.error('Connection error:', error);
                let errorMsg = 'Connection failed: ' + error.message;
                
                // Provide more helpful error messages for common issues
                if (error.name === 'NotFoundError') {
                    errorMsg = 'ESP32 not found. Make sure it\'s powered on and nearby.';
                } else if (error.name === 'SecurityError') {
                    errorMsg = 'Security error. Make sure you\'re using HTTPS and clicked the button directly.';
                } else if (error.name === 'NotSupportedError') {
                    errorMsg = 'WebBluetooth not supported. Try Chrome on Android or Edge on Windows.';
                } else if (error.message.includes('User cancelled')) {
                    errorMsg = 'Connection cancelled. Click Connect to try again.';
                }
                
                status.textContent = errorMsg;
                status.className = 'status disconnected';
            }
        });
        
        async function readInitialValues() {
            // Read tempo
            const tempoData = await tempoChar.readValue();
            const tempo = tempoData.getUint16(0, true);
            tempoInput.value = tempo;
            tempoValue.textContent = tempo;
            
            // Read volume
            const volumeData = await volumeChar.readValue();
            const volume = volumeData.getUint8(0);
            volumeSlider.value = volume;
            volumeValue.textContent = volume + '%';
            
            // Read rhythm
            const rhythmData = await rhythmChar.readValue();
            const rhythm = rhythmData.getUint8(0);
            rhythmSelect.value = rhythm;
            updateRhythmInfo(rhythm);
            
            // Read play state
            const playData = await playStateChar.readValue();
            isPlaying = playData.getUint8(0) === 1;
            updatePlayButton();
        }
        
        async function subscribeToNotifications() {
            // Subscribe to tempo changes
            await tempoChar.startNotifications();
            tempoChar.addEventListener('characteristicvaluechanged', (event) => {
                const tempo = event.target.value.getUint16(0, true);
                tempoInput.value = tempo;
                tempoValue.textContent = tempo;
            });
            
            // Subscribe to volume changes
            await volumeChar.startNotifications();
            volumeChar.addEventListener('characteristicvaluechanged', (event) => {
                const volume = event.target.value.getUint8(0);
                volumeSlider.value = volume;
                volumeValue.textContent = volume + '%';
            });
            
            // Subscribe to rhythm changes
            await rhythmChar.startNotifications();
            rhythmChar.addEventListener('characteristicvaluechanged', (event) => {
                const rhythm = event.target.value.getUint8(0);
                rhythmSelect.value = rhythm;
                updateRhythmInfo(rhythm);
            });
            
            // Subscribe to play state changes
            await playStateChar.startNotifications();
            playStateChar.addEventListener('characteristicvaluechanged', (event) => {
                isPlaying = event.target.value.getUint8(0) === 1;
                updatePlayButton();
            });
        }
        
        function onDisconnected() {
            status.textContent = 'Disconnected';
            status.className = 'status disconnected';
            connectBtn.style.display = 'block';
            controls.style.display = 'none';
            device = null;
        }
        
        function updatePlayButton() {
            if (isPlaying) {
                playBtn.textContent = '⏸ Pause';
                playBtn.className = '';
            } else {
                playBtn.textContent = '▶ Play';
                playBtn.className = 'stopped';
            }
        }
        
        function updateRhythmInfo(rhythmIndex) {
            rhythmInfo.textContent = `Playing: ${RHYTHM_NAMES[rhythmIndex]}`;
        }
        
        // Tempo input
        tempoInput.addEventListener('change', async () => {
            let tempo = parseInt(tempoInput.value);
            if (tempo < 30) tempo = 30;
            if (tempo > 300) tempo = 300;
            tempoInput.value = tempo;
            tempoValue.textContent = tempo;
            
            if (tempoChar) {
                const data = new Uint8Array([tempo & 0xff, tempo >> 8]);
                await tempoChar.writeValue(data);
            }
        });
        
        tempoInput.addEventListener('input', () => {
            tempoValue.textContent = tempoInput.value;
        });
        
        // Volume slider
        volumeSlider.addEventListener('input', async () => {
            const volume = parseInt(volumeSlider.value);
            volumeValue.textContent = volume + '%';
            
            if (volumeChar) {
                const data = new Uint8Array([volume]);
                await volumeChar.writeValue(data);
            }
        });
        
        // Rhythm select
        rhythmSelect.addEventListener('change', async () => {
            const rhythm = parseInt(rhythmSelect.value);
            updateRhythmInfo(rhythm);
            
            if (rhythmChar) {
                const data = new Uint8Array([rhythm]);
                await rhythmChar.writeValue(data);
            }
        });
        
        // Play/Pause button
        playBtn.addEventListener('click', async () => {
            isPlaying = !isPlaying;
            updatePlayButton();
            
            if (playStateChar) {
                const data = new Uint8Array([isPlaying ? 1 : 0]);
                await playStateChar.writeValue(data);
            }
        });
    </script>
</body>
</html>
